services:
  - type: web
    name: shl-recommender
    runtime: python
    buildCommand: "pip install -r requirements.txt && python scrape_catalog.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: google
      - key: GOOGLE_API_KEY
        sync: false   # Set this in Render dashboard → Environment
      - key: PYTHON_VERSION
        value: "3.11.0"
